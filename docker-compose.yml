services:
  backend:
    build:
      context: ./backend
    environment:
      - DEMO_MODE=${DEMO_MODE:-false}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - ELEXON_TIMEOUT_SECONDS=20
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ./frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
